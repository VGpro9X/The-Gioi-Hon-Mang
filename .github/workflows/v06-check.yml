name: V0.6 development validation
on:
  push:
    branches: [dev/v0.6-three-realms]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modules
        run: |
          node --check src/core.mjs
          node --check src/campaign.mjs
          node --check src/main.mjs
          node --check src/journey.mjs
          node --check src/divine.mjs
      - name: Run complete test suite
        run: node --test tests/*.test.mjs
