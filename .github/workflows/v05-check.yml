name: V0.5 development validation
on:
  push:
    branches: [dev/v0.5-divine-ascension]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS modules
        run: |
          node --check src/core.mjs
          node --check src/divine.mjs
          node --check src/expansion.mjs
          node --check src/effects.mjs
          node --check src/main.mjs
      - name: Test combat and UI
        run: node --test tests/*.test.mjs
